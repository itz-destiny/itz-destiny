<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="1060" cy="60" r="90" fill="#22d3ee" opacity="0.18">
    <animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="220" r="70" fill="#6366f1" opacity="0.25">
    <animate attributeName="r" values="60;85;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="118" font-size="58" font-weight="800" fill="url(#txt)">Jonathan Destiny</text>
    <text x="600" y="164" font-size="24" font-weight="600" fill="#c7d2fe" letter-spacing="3">FULL-STACK &amp; AI ENGINEER</text>
    <text x="600" y="206" font-size="17" fill="#e0e7ff" opacity="0.85">Next.js · TypeScript · Rust · Flutter · RAG · Voice agents · Real-time AI</text>
  </g>
  <rect x="470" y="226" width="260" height="4" rx="2" fill="#22d3ee">
    <animate attributeName="width" values="0;260;260" dur="2.5s" fill="freeze"/>
    <animate attributeName="x" values="600;470;470" dur="2.5s" fill="freeze"/>
  </rect>
</svg>
